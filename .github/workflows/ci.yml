# Checks only (AGENTS.md section 0.2): install pinned dependencies, test,
# build into ignored output, audit. No step runs clean.py, train_final.py or
# cluster.py, or writes to an artefact or data/processed.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend constraints and audit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install backend requirements (pinned modelling stack)
        run: python -m pip install -r backend/requirements.txt

      - name: Show the modelling stack the artefacts are loaded with
        run: >
          python -c "import sys, sklearn, pandas, numpy, scipy, joblib;
          print(sys.version.split()[0], 'sklearn', sklearn.__version__,
          'pandas', pandas.__version__, 'numpy', numpy.__version__,
          'scipy', scipy.__version__, 'joblib', joblib.__version__)"

      # Loads all three artefacts through artefacts.load(), so a missing key
      # or a scikit-learn version mismatch fails here. Also runs the OOF-only
      # checks (AGENTS.md 2.1) and the top-pick regression test. -W always
      # surfaces any InconsistentVersionWarning in the log.
      - name: AGENTS.md constraint tests
        run: python -W always -m backend.tests.test_constraints

      - name: Audit Python dependencies
        run: |
          python -m pip install pip-audit
          pip-audit -r backend/requirements.txt

  frontend:
    name: Frontend build and audit
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      # tsc -b && vite build: the typecheck is part of the build.
      - run: npm run build
      - run: npm audit --omit=dev

  api-types:
    name: API types match the backend schema
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - run: python -m pip install -r backend/requirements.txt

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
        working-directory: frontend

      # In-process: FastAPI builds the schema without the app being served.
      - name: Generate the OpenAPI schema
        run: >
          python -c "import json, os; from backend.app import app;
          json.dump(app.openapi(), open(os.path.join(os.environ['RUNNER_TEMP'],
          'openapi.json'), 'w', encoding='utf-8'))"

      # Generated into the runner's temp directory, never over the tracked file.
      - name: Regenerate api-types.d.ts and fail on drift
        working-directory: frontend
        run: |
          npx openapi-typescript "$RUNNER_TEMP/openapi.json" -o "$RUNNER_TEMP/api-types.d.ts"
          diff -u src/lib/api-types.d.ts "$RUNNER_TEMP/api-types.d.ts"

  e2e:
    name: End-to-end browser tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - run: python -m pip install -r backend/requirements.txt

      # Fixtures come from the committed artefacts on every run, by calling
      # the route functions in-process. No live backend.
      - name: Export UI fixtures
        run: python -m backend.tests.export_ui_fixtures frontend/tests/e2e/.fixtures/fixtures.json

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
        working-directory: frontend

      - name: Read the Playwright version
        id: playwright
        working-directory: frontend
        run: echo "version=$(node -p "require('playwright/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Install Chromium and its system dependencies
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Install Chromium system dependencies (browser cached)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        working-directory: frontend
        run: npx playwright install-deps chromium

      - run: npm run build
        working-directory: frontend

      - run: npm run test:e2e
        working-directory: frontend
